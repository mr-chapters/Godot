name: Check JavaScript syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check application JavaScript
        run: node --check app.js
      - name: Check lesson data JavaScript
        run: node --check lessons.js
